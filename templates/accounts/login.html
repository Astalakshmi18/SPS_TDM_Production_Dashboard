{% extends "base/base.html" %}
{% load static %}
{% block title %}Login - Swift Prosys{% endblock %}
{% block auth_content %}
<div class="sp-login-wrap">
  <div class="sp-bg-anim" aria-hidden="true">
    <span class="sp-blob sp-blob-1"></span>
    <span class="sp-blob sp-blob-2"></span>
    <span class="sp-blob sp-blob-3"></span>
    <div class="sp-grid-overlay"></div>
  </div>
  <div class="sp-login-card">
    <div class="text-center mb-3">
      <div class="sp-login-icon sp-login-logo"><img src="{% static 'img/logo.png' %}" alt="Swift Prosys" class="sp-logo-img"></div>
      <p class="text-muted small mb-0 mt-2">Production &amp; Inventory Dashboard</p>
    </div>
    {% if messages %}
      {% for message in messages %}<div class="alert alert-{{ message.tags }} sp-alert">{{ message }}</div>{% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-lg w-100 text-white sp-login-btn">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
