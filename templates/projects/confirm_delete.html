{% extends "base/base.html" %}
{% block content %}
<h4 class="fw-bold mb-3" style="color: var(--sp-navy)">Delete Project</h4>
<div class="sp-panel" style="max-width: 480px">
  <p>Are you sure you want to delete <strong>{{ project.project_name }}</strong>? This also removes its import history. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a href="{% url 'projects:detail' project.pk %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
