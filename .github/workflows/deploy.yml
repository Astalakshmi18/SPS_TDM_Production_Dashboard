name: CI/CD Pipeline - Swift Prosys Auto Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Build & Verify Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: |
          python manage.py check

  deploy-ssh:
    name: Deploy to Cloud VM / Oracle Always Free
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if [ ! -d "/opt/swiftprosys" ]; then
              sudo mkdir -p /opt/swiftprosys
              sudo chown -R $USER:$USER /opt/swiftprosys
              git clone https://github.com/${{ github.repository }}.git /opt/swiftprosys
            fi
            cd /opt/swiftprosys
            git pull origin main
            docker compose down || true
            docker compose up -d --build
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py create_default_admin || true
